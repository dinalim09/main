<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nyang-Suite 0.5 — 화캉스 by HWAKANCE HOTEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ════════════════════════════════
       SCENE 1 · CHECK-IN
  ════════════════════════════════ -->
  <section id="scene-checkin" class="scene active">
    <div class="hotel-letterhead">
      <p class="hotel-label">HWAKANCE HOTEL</p>
      <h1 class="hotel-title">Nyang-Suite<span class="hotel-title-num"> 0.5</span></h1>
      <p class="hotel-sub">0.5평의 프라이빗 스위트</p>
    </div>

    <div class="checkin-card glass">
      <p class="card-eyebrow">GUEST CHECK-IN</p>
      <p class="card-desc">
        지금 이 문 안은<br>
        당신 전용 구역입니다.
      </p>
      <div class="cat-ascii checkin-cat">
        ( ˘ ᆺ ˘ )<br>
        <span class="paw">ﾉ　 ﾉ</span>
      </div>
      <p class="card-hint">고양이 어메니티가 대기 중입니다.</p>
      <button id="btn-checkin" class="btn-primary">CHECK IN</button>
    </div>

    <p class="footer-legal">Standard stay: 3 min &nbsp;|&nbsp; No late checkout</p>
  </section>


  <!-- ════════════════════════════════
       SCENE 2 · STAY (메인 인터랙션)
  ════════════════════════════════ -->
  <section id="scene-stay" class="scene">

    <!-- 타이머 바 -->
    <div id="timer-bar-wrap">
      <div id="timer-bar"></div>
      <span id="timer-label">03:00</span>
    </div>

    <!-- 고양이 인터랙션 영역 -->
    <div id="cat-stage">
      <div id="cat-container">
        <div id="cat-ascii-main" class="cat-ascii">
          ( ˘ ᆺ ˘ )
        </div>
        <div id="cat-body">
          ∫  ∫
        </div>
      </div>
    </div>

    <!-- 상태 팝업 (JS가 동적 생성) -->
    <div id="popup-layer" aria-live="polite"></div>

    <!-- 하단 힌트 -->
    <div id="interaction-hint" class="glass">
      <span>쓰다듬기</span>
      <span class="hint-sep">·</span>
      <span>빠른 터치</span>
      <span class="hint-sep">·</span>
      <span>꾹 누르기</span>
    </div>

  </section>


  <!-- ════════════════════════════════
       SCENE 3 · CHECK-OUT (영수증)
  ════════════════════════════════ -->
  <section id="scene-checkout" class="scene">
    <div class="receipt-wrap glass" id="receipt">
      <p class="receipt-hotel">HWAKANCE HOTEL</p>
      <p class="receipt-title">CHECKOUT RECEIPT</p>
      <hr class="receipt-rule">

      <table class="receipt-table" id="receipt-table">
        <tbody>
          <!-- JS가 동적으로 행 삽입 -->
        </tbody>
      </table>

      <hr class="receipt-rule dashed">

      <div class="receipt-total-row">
        <span>TOTAL LUXURY</span>
        <span id="receipt-total">0 pts</span>
      </div>

      <div class="receipt-cat">
        ( ♡ ᆺ ♡ )<br>
        <span class="paw">ﾉ　 ﾉ</span>
      </div>

      <p class="receipt-msg">갓생 복귀를 축하드립니다.</p>
      <p class="receipt-date" id="receipt-date"></p>
    </div>

    <div class="checkout-actions">
      <button id="btn-save" class="btn-secondary">영수증 저장</button>
      <button id="btn-restart" class="btn-ghost">재입실</button>
    </div>
  </section>


  <script src="js/main.js"></script>
</body>
</html>
